<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070d24">
  <title>非常好小游戏</title>
  <!-- 不引用任何外网资源：外网字体被墙时会卡住首屏渲染，导致整页空白 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 class="logo">PIXEL<span>TRIS</span></h1>
      <p class="tagline">MORE CUSTOMISATION, MORE FUN.</p>
    </header>

    <main class="stage">
      <div class="board-wrap">
        <canvas id="board" width="320" height="640"></canvas>
        <div id="overlay" class="overlay show">
          <div class="overlay-card">
            <h2 id="ov-title">PIXEL TRIS</h2>
            <p id="ov-text"></p>
            <button id="ov-btn" class="btn-primary" type="button">开始游戏</button>
          </div>
        </div>
        <div id="confirm" class="overlay">
          <div class="overlay-card">
            <h2 id="cf-title">重新开始？</h2>
            <p id="cf-text">当前进度会被清空</p>
            <div class="cf-btns">
              <button id="cf-yes" class="btn-primary" type="button">是</button>
              <button id="cf-no" class="btn-ghost" type="button">否</button>
            </div>
          </div>
        </div>
        <div id="countdown" class="countdown"></div>
      </div>

      <aside class="panel">
        <div class="panel-block">
          <div class="panel-label">NEXT</div>
          <canvas id="next" width="80" height="80"></canvas>
        </div>
        <div class="panel-block">
          <div class="panel-label">TIME</div>
          <div id="stat-time" class="panel-value">00:00</div>
        </div>
        <div class="panel-block">
          <div class="panel-label">SCORE</div>
          <div id="stat-score" class="panel-value">0</div>
        </div>
        <div class="panel-block">
          <div class="panel-label">CLEARS</div>
          <div id="stat-clears" class="panel-value">0</div>
        </div>
        <div class="panel-block">
          <div class="panel-label">LEVEL</div>
          <div id="stat-level" class="panel-value">1</div>
        </div>
        <div class="panel-block">
          <div class="panel-label">BEST</div>
          <div id="stat-best" class="panel-value dim">0</div>
        </div>
        <div class="panel-block">
          <div class="panel-label">SOUND</div>
          <button id="btn-sound" class="panel-btn" type="button" title="音效开关" aria-label="音效开关">♪</button>
        </div>
        <div class="panel-block" id="restart-block">
          <div class="panel-label">RESTART</div>
          <button id="btn-restart" class="panel-btn" type="button">重新开始</button>
        </div>
        <div class="panel-block" id="debug-block">
          <div class="panel-label">DEBUG</div>
          <div id="stat-debug" class="panel-value dim">-</div>
        </div>
      </aside>
    </main>

    <nav class="pad" aria-label="触屏操作">
      <button type="button" data-act="left">◀</button>
      <button type="button" data-act="rotate">⟳</button>
      <button type="button" data-act="right">▶</button>
      <button type="button" data-act="down">▼</button>
      <button type="button" data-act="drop" class="wide">DROP</button>
    </nav>

    <p class="hint">← → 移动　↑ / Z 旋转　↓ 软降　空格 直落　P 暂停</p>
  </div>

  <!-- ?v= 是版本号：改了 js 之后把它加一，浏览器就不会用旧缓存 -->
  <script src="core.js?v=14"></script>
  <script src="game.js?v=14"></script>
</body>
</html>
